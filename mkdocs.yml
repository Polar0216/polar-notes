site_name: Polar Notes
site_description: Polar 的个人学习笔记

theme:
  name: material
  language: zh

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - awesome-nav

markdown_extensions:
  - toc:
      toc_depth: "2-6"
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
